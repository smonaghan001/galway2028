backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: posts
    label: News Posts
    label_singular: News Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Headline for the news post"
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
      - label: Summary
        name: summary
        widget: text
        hint: "Short description shown on the news listing page (1-2 sentences)"
      - label: Cover Image
        name: image
        widget: image
        required: false
        hint: "Optional photo for this post"
      - label: Body
        name: body
        widget: markdown
        hint: "The full news post content"
